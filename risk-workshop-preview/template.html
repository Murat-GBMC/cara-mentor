<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARA Risk Atölyesi — Taze Hat</title>
<style>
:root{--ink:#193c57;--teal:#007f79;--line:#d7e0e6;--muted:#607583}*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#213541;font:15px/1.55 system-ui,sans-serif}header{background:var(--ink);color:white;padding:30px max(24px,calc((100vw - 1250px)/2))}header small{color:#b9dcd8;letter-spacing:2px}h1{font-size:32px;margin:8px 0}h2{margin-top:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;color:var(--ink);border-radius:9px;padding:10px 15px}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus,textarea:focus,select:focus{outline:3px solid #6ec9c2;outline-offset:2px}nav{display:flex;gap:7px;flex-wrap:wrap;max-width:1250px;margin:22px auto;padding:0 15px}nav .active{background:var(--ink);color:white}.layout{max-width:1250px;display:grid;grid-template-columns:300px 1fr;gap:20px;margin:0 auto 40px;padding:0 15px}aside,.card{background:white;border:1px solid var(--line);border-radius:15px;padding:22px}aside{align-self:start;position:sticky;top:15px;max-height:85vh;overflow:auto}details{border-bottom:1px solid var(--line);padding:12px 0}summary{cursor:pointer;font-weight:650;color:var(--ink)}.doc{white-space:pre-line;font-size:14px}.muted{color:var(--muted)}.notice{background:#e9f4f2;border-left:4px solid var(--teal);padding:12px 16px;margin:15px 0}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}label{display:block;font-weight:600;margin:12px 0 5px}textarea,input:not([type=checkbox]),select{width:100%;padding:10px;border:1px solid #bacbd5;border-radius:7px;background:white;color:#213541}textarea{min-height:80px;resize:vertical}.risk{border:1px solid var(--line);border-radius:12px;padding:17px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.badge{display:inline-block;background:#eaf0f4;padding:3px 9px;border-radius:20px;font-size:13px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}.feedback{white-space:pre-line;background:#edf3fa;padding:17px;border-radius:10px;margin:15px 0}.matrix{table-layout:fixed;margin-bottom:20px}.matrix td{height:58px;font-size:12px}.low{background:#e1f0e9}.mid{background:#fff0c7}.high{background:#fbdedb}.opp{background:#dcebf7}.count{font-weight:700;color:var(--teal)}#status{max-width:1220px;margin:10px auto;padding:10px 15px;white-space:pre-line}#status:empty{display:none}.error{background:#fce6e4;color:#9c2924}footer{max-width:1250px;margin:20px auto;padding:15px}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:static;max-height:none}.grid{grid-template-columns:1fr}h1{font-size:26px}}@media print{header,nav,aside,footer,.actions,#status,.no-print{display:none!important}.layout{display:block;margin:0;padding:0}.card{border:0;padding:0}body{background:white;font-size:10pt}.risk{break-inside:avoid}h2{break-before:page}h2:first-child{break-before:auto}textarea{border:0} @page{size:A4;margin:15mm}}
</style>
<header><small>GBMC · CARA İLE UYGULAMA</small><h1>Taze Hat: İlk Risk Atölyeniz</h1><div>Belgelerden risklere, risklerden gerekçeli önceliklere · 25–35 dakika</div></header>
<nav id="nav" aria-label="Çalışma aşamaları"></nav><div id="status" role="status" aria-live="polite"></div>
<div class="layout"><aside><h3>Proje dosyanız</h3><div id="docs"></div><details><summary>Ölçekler</summary><div id="scales"></div></details><label for="notes">Kişisel notlarınız</label><textarea id="notes" placeholder="Notlar rapora eklenmez."></textarea><small id="saveLabel" class="muted">Taslak bu tarayıcıda saklanır. Cihazlar arası kayıt bu testte etkin değildir.</small></aside><main class="card" id="main"></main></div>
<footer><p class="muted">Test sürümü · Çalışmanız bu tarayıcıda saklanır. <button id="delete">Taslağımı sil</button></p></footer>
<!-- LearnWorlds editöründe bu iki alanın değerlerini kişiselleştirme seçicisinden ekleyin.
certification-name: cf_certification_name; first-name: varsa ad alanı. Yer tutucular çözülmezse genel hitap kullanılır. -->
<div id="caraParticipant" data-certification-name="" data-first-name="" hidden></div>
<script>
const CONTENT=__CONTENT__;
const KEY='cara_rm1_review_v1';
const fresh=()=>({version:1,stage:0,unlocked:0,opened:[],notes:'',answers:CONTENT.statements.map(()=>({choice:'',reason:''})),risks:[],nextId:1,urgent:'',earliest:'',reflection:'',consult:'',feedback:{},reviewed:{},revisions:{},started:new Date().toISOString()});
let state=fresh();try{const s=JSON.parse(localStorage.getItem(KEY));if(s?.version===1)state={...state,...s}}catch(_){}
let busy=false;const names=['Projeye katılın','Belgeleri inceleyin','Ayıklayın','Riskleri oluşturun','Önceliklendirin','Sponsora hazırlanın'];
const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('#saveLabel').textContent='Bu tarayıcıda kaydedildi · '+new Date().toLocaleTimeString('tr-TR')}catch(_){$('#saveLabel').textContent='Kayıt yapılamadı. Tarayıcı depolamasını kontrol edin.'}}
function message(t,error=false){$('#status').textContent=t;$('#status').className=error?'error':''}
function invalidate(stage){for(let i=stage;i<6;i++){delete state.reviewed[i];delete state.feedback[i]}state.unlocked=Math.min(state.unlocked,stage);save()}
const table=rows=>'<table>'+rows.map((r,i)=>'<tr>'+r.map(c=>`<${i?'td':'th'}>${esc(c)}</${i?'td':'th'}>`).join('')+'</tr>').join('')+'</table>';
const field=(label,value,bind)=>`<label>${esc(label)}<textarea data-bind="${bind}">${esc(value)}</textarea></label>`;
const options=(list,value)=>'<option value="">Seçin</option>'+list.map(s=>`<option ${s===value?'selected':''}>${esc(s)}</option>`).join('');
// Display-only identity. Never used to authorize server requests or sent to CARA.
let participant={fullName:'',firstName:''};
function cleanName(value){if(typeof value!=='string')return '';const s=value.replace(/[\u0000-\u001f\u007f]/g,'').replace(/\s+/g,' ').trim();return !s||/[{}<>]/.test(s)||s.length>150?'':s}
function fieldValue(value){return cleanName(typeof value==='string'?value:value?.value)}
function fromUser(u){if(!u||typeof u!=='object')return {};return {fullName:fieldValue(u.cf_certification_name)||fieldValue(u.custom_fields?.cf_certification_name),firstName:fieldValue(u.first_name)||fieldValue(u.firstName)}}
function readParticipant(){const el=document.getElementById('caraParticipant');let candidates=[];try{candidates.push(fromUser(window.LW?.user))}catch(_){}try{if(window.parent!==window)candidates.push(fromUser(window.parent.LW?.user))}catch(_){}const direct=window.CARA_PARTICIPANT||{};candidates.unshift({fullName:fieldValue(direct.certificationName),firstName:fieldValue(direct.firstName)},{fullName:fieldValue(el?.dataset.certificationName),firstName:fieldValue(el?.dataset.firstName)});const fullName=candidates.map(x=>x.fullName).find(Boolean)||'';const firstName=candidates.map(x=>x.firstName).find(Boolean)||fullName.split(' ')[0]||'';return {fullName,firstName}}
function welcome(){return participant.firstName?`Sevgili ${participant.firstName}, Taze Hat Projesine hoş geldin.`:'Taze Hat Projesine hoş geldin.'}
function documentText(d,i){let text=d.text;const name=participant.firstName;if(!name)return text;if(i===0)text=text.replace('Merhaba,',`${name} merhaba,`);if(i===3)text=text.replace('Merhaba,',`${name} merhaba,`);if(i===5)text=text.replace('Merhaba,',`${name} selam,`);if(i===6)text=`${name} selam,\n\n`+text;return text}
function projectRows(){return CONTENT.project.map(row=>row[0]==='Proje yöneticisi'?[row[0],participant.fullName||'Siz']:row)}
function refreshParticipant(){const next=readParticipant();if(next.fullName===participant.fullName&&next.firstName===participant.firstName)return;participant=next;const w=document.getElementById('participantWelcome');if(w)w.textContent=welcome();const card=document.getElementById('projectCard');if(card)card.innerHTML=table(projectRows());document.querySelectorAll('#docs .doc').forEach((el,i)=>el.textContent=documentText(CONTENT.documents[i],i))}
function initDocs(){$('#docs').innerHTML=CONTENT.documents.map((d,i)=>`<details data-doc="${i}"><summary>${esc(d.title)}</summary><div class="doc">${esc(documentText(d,i))}</div></details>`).join('');$('#docs').querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{if(d.open&&!state.opened.includes(+d.dataset.doc)){state.opened.push(+d.dataset.doc);save();updateNext()}}));$('#scales').innerHTML='<h4>Tehdit etkisi ve olasılık</h4>'+table(CONTENT.negative)+'<h4>Fırsat etkisi</h4>'+table(CONTENT.positive);$('#notes').value=state.notes;$('#notes').oninput=e=>{state.notes=e.target.value;save()}}
function canProceed(){switch(state.stage){case 0:return true;case 1:return state.opened.length===7;case 2:return state.answers.every(a=>a.choice&&a.reason.trim())&&!!state.reviewed[2];case 3:return state.risks.length>=8&&state.risks.some(r=>r.type==='Fırsat')&&state.risks.every(r=>r.cause.trim()&&r.event.trim()&&r.effect.trim()&&r.category)&&!!state.reviewed[3];case 4:return state.risks.every(r=>r.o&&r.e)&&state.risks.filter(r=>r.top).length===5&&state.risks.filter(r=>r.top).every(r=>r.reason.trim())&&!!state.urgent.trim()&&!!state.earliest.trim()&&!!state.reviewed[4];case 5:return !!state.reviewed[5]&&!!state.reflection.trim()&&!!state.consult.trim()}}
function updateNext(){if($('#openedCount'))$('#openedCount').textContent=state.opened.length;const b=$('#next');if(b)b.disabled=busy||!canProceed();const r=$('#review');if(r)r.disabled=busy}
function sentence(r){return `${r.cause} nedeniyle, ${r.event}. Bu da ${r.effect}.`}
function riskForm(r){return `<article class="risk"><div class="actions"><strong>${esc(r.id)}</strong><button data-remove="${r.id}">Sil</button></div><div class="grid"><label>Tür<select data-risk="${r.id}" data-key="type">${options(['Tehdit','Fırsat'],r.type)}</select></label><label>Kategori<select data-risk="${r.id}" data-key="category">${options(['İnsan','Teknik','Tedarikçi','Paydaş ve organizasyon','Dış etkenler','Takvim ve bütçe'],r.category)}</select></label></div>${['cause','event','effect'].map((k,i)=>`<label>${['Neden — somut koşul','Olası olay — ne olabilir?','Etki — hangi hedef etkilenir?'][i]}<textarea data-risk="${r.id}" data-key="${k}">${esc(r[k])}</textarea></label>`).join('')}<label>Kaynak belgeler (isteğe bağlı)<input data-risk="${r.id}" data-key="source" value="${esc(r.source)}" placeholder="Örn. Belge 3, Belge 7"></label><p class="notice" id="sentence-${r.id}">${esc(sentence(r))}</p></article>`}
function matrix(type){let html=`<h3>${type==='Fırsat'?'Fırsatlar':'Tehditler'} — olasılık × etki</h3><table class="matrix"><tr><th>O ↓ / E →</th>${[1,2,3,4,5].map(x=>'<th>'+x+'</th>').join('')}</tr>`;for(let o=5;o>=1;o--){html+=`<tr><th>${o}</th>`;for(let e=1;e<=5;e++){const score=o*e;html+=`<td class="${type==='Fırsat'?'opp':score>=15?'high':score>=8?'mid':'low'}">${state.risks.filter(r=>r.type===type&&+r.o===o&&+r.e===e).map(r=>esc(r.id)).join(', ')}</td>`}html+='</tr>'}return html+'</table>'}
function reviewBlock(){return `<div class="actions no-print"><button id="review" class="primary">CARA’dan geri bildirim al</button></div><p class="muted no-print">İlerlemek için bu aşamada en az bir CARA değerlendirmesi gerekir. Cevapları değiştirdiğinizde değerlendirme yenilenir.</p>${state.feedback[state.stage]?`<div class="feedback" role="region" aria-label="CARA geri bildirimi">${esc(state.feedback[state.stage])}</div>`:''}`}
function render(){const s=state.stage;$('#nav').innerHTML=names.map((n,i)=>`<button data-stage="${i}" ${busy||i>state.unlocked?'disabled':''} class="${s===i?'active':''}" ${s===i?'aria-current="step"':''}>${i+1}. ${n}</button>`).join('');let h=`<span class="badge">Aşama ${s+1} / 6</span><h2>${names[s]}</h2>`;
if(s===0)h+=`<div class="notice" id="participantWelcome">${esc(welcome())}</div><p style="white-space:pre-line">${esc(CONTENT.scenario)}</p><div id="projectCard">${table(projectRows())}</div><div class="notice">Pazartesi Kerem Bey’e ilk beş riski sunacaksınız. Önce belgeleri inceleyin; sonra ayrım yapın, riskleri oluşturun ve önceliklendirin.</div>`;
if(s===1)h+='<p>Soldaki yedi belgeyi açıp okuyun. Belgeler sonraki aşamalarda da erişilebilir kalır.</p><p>Okuma sırasında notlarınızı kişisel not alanına yazabilirsiniz. Belgeleri açmak, içeriğini anladığınızın değerlendirmesi değildir.</p><p class="count">Açılan belge: <span id="openedCount">'+state.opened.length+'</span> / 7</p>';
if(s===2)h+=`<div class="notice">${esc(CONTENT.attention)}</div>`+CONTENT.statements.map((t,i)=>`<article class="risk"><strong>${i+1}. ${esc(t)}</strong><label>Sınıflandırma<select data-answer="${i}" data-key="choice">${options(['Risk','Sorun','Varsayım','Endişe'],state.answers[i].choice)}</select></label><label>Gerekçeniz<textarea data-answer="${i}" data-key="reason">${esc(state.answers[i].reason)}</textarea></label></article>`).join('')+reviewBlock();
if(s===3)h+=`<p>En az sekiz risk oluşturun; en az biri fırsat olsun. Cümleleriniz somut bir neden, belirsiz bir olay ve hedefe etkisini içersin.</p><p class="count">${state.risks.length} / en az 8 · Fırsat: ${state.risks.filter(r=>r.type==='Fırsat').length} · Kategori: ${new Set(state.risks.map(r=>r.category).filter(Boolean)).size} / 6</p>`+state.risks.map(riskForm).join('')+'<button id="add">+ Risk ekle</button>'+reviewBlock();
if(s===4)h+='<p>Her riski ölçeklere göre puanlayın ve gerekçeli ilk beşinizi seçin. Fırsatların etkisini olumlu etki ölçeğiyle değerlendirin.</p>'+matrix('Tehdit')+matrix('Fırsat')+state.risks.map(r=>`<article class="risk"><strong>${esc(r.id)} · ${esc(r.type)}</strong><p>${esc(sentence(r))}</p><div class="grid"><label>Olasılık<select data-risk="${r.id}" data-key="o">${options(['1','2','3','4','5'],r.o)}</select></label><label>Etki<select data-risk="${r.id}" data-key="e">${options(['1','2','3','4','5'],r.e)}</select></label></div><p>Puan: ${r.o*r.e||'—'}</p><label><input type="checkbox" data-risk="${r.id}" data-key="top" ${r.top?'checked':''}> İlk beşime al</label><label>Öncelik gerekçesi<textarea data-risk="${r.id}" data-key="reason">${esc(r.reason)}</textarea></label></article>`).join('')+field('Bu beş risk arasında bugün ilk ele alınması gereken hangisi? Neden?',state.urgent,'urgent')+field('Hangi risk en erken gerçekleşebilir? Neden?',state.earliest,'earliest')+reviewBlock();
if(s===5)h+='<p>İlk beş riskinizi sponsor için kısaltın. Her özet en fazla 25 kelime olsun.</p>'+state.risks.filter(r=>r.top).map(r=>`<article class="risk"><strong>${esc(r.id)} · Puan ${r.o*r.e}</strong><p>${esc(sentence(r))}</p><label>Sponsor için kısa özet<textarea data-risk="${r.id}" data-key="summary">${esc(r.summary)}</textarea></label><p>${esc(r.reason)}</p></article>`).join('')+field('Kontrol etmeden doğru kabul ettiğiniz bir varsayım hangisi? Nasıl kontrol edersiniz?',state.reflection,'reflection')+field('Bu riskleri daha iyi görmek için kime danışırdınız?',state.consult,'consult')+reviewBlock()+`<div class="actions"><button id="print" ${canProceed()?'':'disabled'}>Raporu yazdır / PDF kaydet</button></div>`;
h+=`<div class="actions no-print">${s>0?'<button id="back">Önceki aşama</button>':''}${s<5?`<button id="next" class="primary">${s===0?'Çalışmaya başla':'Kaydet ve devam et'}</button>`:''}</div>`;$('#main').innerHTML=h;bind();updateNext()}
function bind(){$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.stage=+b.dataset.stage;save();render()});$('#back')?.addEventListener('click',()=>{state.stage--;save();render()});$('#next')?.addEventListener('click',()=>{if(!canProceed())return;state.stage++;state.unlocked=Math.max(state.unlocked,state.stage);save();render();$('#main').scrollIntoView({block:'start',behavior:'smooth'})});
$('#main').querySelectorAll('[data-answer]').forEach(el=>el.oninput=()=>{state.answers[+el.dataset.answer][el.dataset.key]=el.value;invalidate(2);updateNext()});
$('#main').querySelectorAll('[data-bind]').forEach(el=>el.oninput=()=>{state[el.dataset.bind]=el.value;invalidate(state.stage);updateNext()});
$('#main').querySelectorAll('[data-risk]').forEach(el=>el.oninput=()=>{const r=state.risks.find(r=>r.id===el.dataset.risk);if(el.dataset.key==='top'&&el.checked&&state.risks.filter(x=>x.top).length>=5){el.checked=false;message('En fazla beş risk seçebilirsiniz.',true);return}r[el.dataset.key]=el.type==='checkbox'?el.checked:el.value;invalidate(state.stage);if($('#sentence-'+r.id))$('#sentence-'+r.id).textContent=sentence(r);if(el.tagName==='SELECT'||el.type==='checkbox')render();else updateNext()});
$('#main').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.risks=state.risks.filter(r=>r.id!==b.dataset.remove);invalidate(3);render()});$('#add')?.addEventListener('click',()=>{state.risks.push({id:'R'+String(state.nextId++).padStart(2,'0'),type:'Tehdit',category:'',cause:'',event:'',effect:'',source:'',o:'',e:'',top:false,reason:'',summary:''});invalidate(3);render()});$('#review')?.addEventListener('click',review);$('#print')?.addEventListener('click',printReport)}
function payload(){const s=state.stage;if(s===2)return {answers:state.answers};if(s===3)return {risks:state.risks.map(({id,type,category,cause,event,effect,source})=>({id,type,category,cause,event,effect,source}))};if(s===4)return {risks:state.risks,urgent:state.urgent,earliest:state.earliest};return {risks:state.risks.filter(r=>r.top),reflection:state.reflection,consult:state.consult,previousFeedback:state.feedback}}
async function review(){if(busy)return;const s=state.stage;
if(s===2&&!state.answers.every(a=>a.choice&&a.reason.trim()))return message('Altı ifadenin seçim ve gerekçesini tamamlayın.',true);
if(s===3&&!(state.risks.length>=8&&state.risks.some(r=>r.type==='Fırsat')&&state.risks.every(r=>r.cause.trim()&&r.event.trim()&&r.effect.trim()&&r.category)))return message('En az sekiz tam risk ve bir fırsat gerekli.',true);
if(s===4&&!(state.risks.every(r=>r.o&&r.e)&&state.risks.filter(r=>r.top).length===5&&state.risks.filter(r=>r.top).every(r=>r.reason.trim())&&state.urgent.trim()&&state.earliest.trim()))return message('Puanları, ilk beşi, gerekçelerini ve iki zaman sorusunu tamamlayın.',true);
if(s===5&&(!state.reflection.trim()||!state.consult.trim()||state.risks.filter(r=>r.top).some(r=>!r.summary.trim()||r.summary.trim().split(/\s+/).length>25)))return message('İki yansımayı ve her risk için en fazla 25 kelimelik sponsor özetini tamamlayın.',true);
const endpoint=new URL('/api/risk-review',location.origin).href;
try{const u=new URL(endpoint);if(u.protocol!=='https:'&&!['localhost','127.0.0.1'].includes(u.hostname))throw Error();}catch(_){return message('Geçerli bir HTTPS test adresi girin.',true)}
busy=true;render();$('#main').querySelectorAll('input,textarea,select,button').forEach(e=>e.disabled=true);message('CARA cevaplarınızı inceliyor…');try{const response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','X-CARA-Activity':'risk-workshop'},body:JSON.stringify({caseId:'RM-1',stage:'A'+(s+1),submission:payload()}),credentials:'same-origin',signal:AbortSignal.timeout(90000)});const d=await response.json();if(!response.ok)throw Error(d.error||'CARA yanıtı alınamadı.');if(typeof d.feedback!=='string'||!d.feedback.trim())throw Error('Boş değerlendirme.');state.feedback[s]=d.feedback;state.reviewed[s]=true;save();message('CARA değerlendirmesi hazır. Geri bildirimi okuyup devam edebilir veya cevabınızı düzeltebilirsiniz.')}catch(e){message(e.message||'Bağlantı kurulamadı. Taslağınız korundu.',true)}finally{busy=false;render()}}
function printReport(){if(!canProceed())return;const w=window.open('','_blank');if(!w)return message('Yazdırma için açılır pencereye izin verin.',true);const chosen=state.risks.filter(r=>r.top);w.document.write('<!doctype html><html lang="tr"><meta charset="utf-8"><title>Taze Hat Risk Raporu</title><style>body{font:11pt/1.5 system-ui;color:#193c57}table{border-collapse:collapse;width:100%;font-size:9pt}td,th{border:1px solid #bbc;padding:7px;text-align:left}h2{break-before:page}p{white-space:pre-line}.low{background:#e1f0e9}.mid{background:#fff0c7}.high{background:#fbdedb}.opp{background:#dcebf7}.matrix{table-layout:fixed}.matrix td{height:42px}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:A4;margin:15mm}</style><h1>Taze Hat — Sponsora İlk Beş Risk</h1><p>'+new Date().toLocaleDateString('tr-TR')+'</p>'+(participant.fullName?'<p><strong>Hazırlayan:</strong> '+esc(participant.fullName)+'</p>':'')+chosen.map(r=>'<h3>'+esc(r.id)+' · '+esc(r.summary)+'</h3><p>O × E: '+r.o+' × '+r.e+' = '+r.o*r.e+'<br>'+esc(r.reason)+'</p>').join('')+'<h2>Tam Risk Kaydı</h2>'+table([['Kod','Tür','Neden – Olay – Etki','O','E','Puan'],...state.risks.map(r=>[r.id,r.type,sentence(r),r.o,r.e,r.o*r.e])])+'<h2>Matrisler</h2>'+matrix('Tehdit')+matrix('Fırsat')+'<h2>Ayıklama</h2>'+table([['İfade','Seçim','Gerekçe'],...CONTENT.statements.map((t,i)=>[t,state.answers[i].choice,state.answers[i].reason])])+'<h2>Zaman ve Yansımalar</h2><h3>Bugün ilk ele alınması gereken</h3><p>'+esc(state.urgent)+'</p><h3>En erken gerçekleşebilecek</h3><p>'+esc(state.earliest)+'</p><h3>Varsayım ve kontrol yöntemi</h3><p>'+esc(state.reflection)+'</p><h3>Danışılacak kişiler</h3><p>'+esc(state.consult)+'</p><h2>CARA Geri Bildirimleri</h2>'+[2,3,4,5].map(s=>'<h3>'+names[s]+'</h3><p>'+esc(state.feedback[s]||'')+'</p>').join('')+'</html>');w.document.close();setTimeout(()=>{w.focus();w.print()},400)}
